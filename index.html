<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Office Lunch</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B4%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-block">
        <h1 class="brand">
          <span class="brand-emoji" aria-hidden="true">🍴</span>
          <span class="brand-text" data-i18n="brand">Office Lunch</span>
        </h1>
        <p class="subtitle" data-i18n="subtitle">Today's lunch options near the office</p>
      </div>
      <div class="controls">
        <p class="today" id="today"></p>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="de">DE</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="fr">FR</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p id="status" class="status" role="status"></p>
    <div id="grid" class="grid" hidden></div>
    <footer class="footer">
      <span data-i18n="footer-updated">Last updated:</span>
      <time id="updated"></time>
      <span class="footer-sep">·</span>
      <a href="https://github.com/markusdvogler/office-lunch" id="repo-link" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>

  <template id="card-template">
    <article class="card">
      <header class="card-head">
        <div class="card-title-block">
          <h2 class="card-title"></h2>
          <p class="card-subtitle"></p>
        </div>
        <a class="card-link" target="_blank" rel="noopener"></a>
      </header>
      <div class="card-body">
        <ul class="menu-items"></ul>
        <div class="card-state" hidden></div>
      </div>
      <footer class="card-foot" hidden>
        <span class="card-note"></span>
      </footer>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
